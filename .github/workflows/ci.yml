name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cmake:
    uses: cear12/ci-workflows/.github/workflows/cmake.yml@v1
    with:
      tsan: true   # thread pool + producer/consumer queue: exactly what TSan is for
